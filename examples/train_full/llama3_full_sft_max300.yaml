### model
model_name_or_path: /data/code-pretrain1/fsk/LLamA-mesh/huggingface_weights/Meta-Llama-3-8B-Instruct

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: 3D_future_data_SFT_sigle_dialogue,ShapeNet_data_SFT_sigle_dialogue,ObjaverseV1_Max50to300_data_SFT_sigle_dialogue,3D_future_data_SFT_sigle_dialogue,ShapeNet_data_SFT_sigle_dialogue,3D_future_data_SFT_sigle_dialogue,ShapeNet_data_SFT_sigle_dialogue
template: llama3
cutoff_len: 8192
max_samples: 10000000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/llama3-8b/full/sft_lr2e5_epoch3_72GPUs_max50to300_3XOthers
logging_steps: 10
save_steps: 4000
plot_loss: true
overwrite_output_dir: true

### train: 2e-4的Lr对于future和shapenet会学崩
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 2.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 1000

# generate
max_new_tokens: 8192
